# ============================================================================
# 生产部署 compose（云服务器：111.229.141.149 / ubuntu）
# ----------------------------------------------------------------------------
# 设计要点：
#  * 网关/redis 两个服务【不发布任何宿主机端口】，避免与同机运行的
#    card-rules-assistant 栈（已占 80/443/3000/22）冲突。
#  * 通过加入现有 Caddy 网络 card-rules-assistant_default，由 Caddy 按子域名
#    llmgateway.asdfghjkl.site 反向代理到 gateway:8000（同网络内网 DNS 可达）。
#  * 语义缓存 embedding 后端走远端 DashScope 兼容端点（见 .env 的
#    SEMANTIC_EMBEDDING_*），不自带 ollama 容器 —— 省 ~3GB 磁盘/显存，
#    适配本机仅剩 7.4G 的空间。
#  * 启动：在仓库目录执行
#        docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 不发布宿主机端口：仅容器网络内 gateway 可访问
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - default

  gateway:
    build:
      context: .
      # 国内服务器构建提速：pip/npm/apt 走阿里云镜像。
      args:
        PIP_INDEX: https://mirrors.aliyun.com/pypi/simple/
        NPM_REGISTRY: https://registry.npmmirror.com
        APT_MIRROR: mirrors.aliyun.com
        # 前端 API 前缀：生产走 Caddy /gw 路径代理，须与 Caddyfile 的 handle /gw/* 一致。
        VITE_API_BASE: "/gw"
    # 不发布宿主机端口：Caddy 通过 gateway:8000 内网访问
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    # 生产接线：真实 Redis。覆盖 .env 中可能残留的开关。
    # 注意：SEMANTIC_EMBEDDING_* 不在此覆盖，由 .env 指向 DashScope 远端端点。
    environment:
      - REDIS_FAKE=0
      - MOCK_PROVIDER=0
      - REDIS_URL=redis://redis:6379
      - SEMANTIC_CACHE_ENABLE=1
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
    # 持久化 SQLite 元数据（账号/虚拟Key/路由别名/用量/provider）。
    volumes:
      - ./data:/app/data
    networks:
      - default

volumes:
  redis-data:

# 复用 card-rules 的 Caddy 网络，使 gateway 与 card-rules-caddy 互通。
networks:
  default:
    external: true
    name: card-rules-assistant_default
